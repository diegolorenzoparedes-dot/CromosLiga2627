name: Build clean v1.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - buildsrc/v14b64_*.txt
      - .github/workflows/build-v14-clean.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild and validate exact v1.4 source
        shell: bash
        run: |
          echo "791ee5ceacf6715894adf1901c2c3452d94f49c9e0dd05f89465a45ef64bde4c  buildsrc/v14b64_00.txt" | sha256sum -c -
          echo "02895fd5f6425ba1c412b7faeef96a0e5ece030113de7874faaff0742a576244  buildsrc/v14b64_01.txt" | sha256sum -c -
          echo "ebb5ebbb9820a1bcb1d9c24fb7c4b27934b1052e722c8ed7bb2d32700cb2db15  buildsrc/v14b64_02.txt" | sha256sum -c -
          echo "6e5d614a671296073d27131fc79767cf243d961841e961e59b00209d368a75fe  buildsrc/v14b64_03.txt" | sha256sum -c -
          echo "665a6c68e7c062ddf458afbfa8dfb790bf5a8e8f0986ac3de8b2e11759115677  buildsrc/v14b64_04.txt" | sha256sum -c -
          echo "b48b44992c23a0f25e825b659dbf274f41e52f7946b02e5c85dc4c69ae78c5d4  buildsrc/v14b64_05.txt" | sha256sum -c -
          echo "1b17a70f4d3e1eee1df267428144d517cae97c0c3125542f6c34c50ab54591e4  buildsrc/v14b64_06.txt" | sha256sum -c -
          cat buildsrc/v14b64_00.txt buildsrc/v14b64_01.txt buildsrc/v14b64_02.txt buildsrc/v14b64_03.txt buildsrc/v14b64_04.txt buildsrc/v14b64_05.txt buildsrc/v14b64_06.txt > /tmp/v14.b64
          base64 -d /tmp/v14.b64 > /tmp/v14source.zip
          echo "b69a546813bf3d0751636fc2ce8fbc631ee836d407000c69880f78fff1589e5e  /tmp/v14source.zip" | sha256sum -c -
          unzip -t /tmp/v14source.zip
          rm -rf cleanbuild
          mkdir cleanbuild
          unzip -q /tmp/v14source.zip -d cleanbuild
          cd cleanbuild/CromosLiga2627
          sed -i "s/applicationId 'com.cervantes.cromosliga2627'/applicationId 'com.cervantes.cromosliga2627.clean14'/" app/build.gradle
          sed -i "s/versionCode 1/versionCode 14/" app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.4-clean'/" app/build.gradle
      - name: Build APK with Android Gradle plugin
        working-directory: cleanbuild/CromosLiga2627
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          APK=cleanbuild/CromosLiga2627/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tee zipalign.txt
          unzip -lv "$APK" | grep -E 'resources\.arsc|AndroidManifest\.xml|classes.*\.dex' | tee packaging.txt
          cp "$APK" CromosLiga2627_v1.4_rebuilt.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CromosLiga2627-v1.4-rebuilt
          path: |
            CromosLiga2627_v1.4_rebuilt.apk
            apksigner.txt
            zipalign.txt
            packaging.txt
