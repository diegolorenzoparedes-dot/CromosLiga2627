name: Build Rebuilt v1.5.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'buildsrc/html/**'
      - 'buildsrc/v15.js'
      - 'buildsrc/v151.js'
      - 'buildsrc/logos_sprite.webp'
      - 'buildsrc/icon160.b64'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/cervantes/cromosliga2627/v151
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat buildsrc/html/index_00.part               buildsrc/html/index_01.part               buildsrc/html/index_02.part               buildsrc/html/index_03.part               buildsrc/html/index_04.part               buildsrc/html/index_05.part               > app/src/main/assets/index.html

          cp buildsrc/v15.js app/src/main/assets/v15.js
          cp buildsrc/v151.js app/src/main/assets/v151.js
          cp buildsrc/logos_sprite.webp app/src/main/assets/logos_sprite.webp
          base64 -d buildsrc/icon160.b64 > app/src/main/res/drawable/app_icon_foreground.png

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          h=p.read_text(encoding='utf-8')
          h=h.replace('</body>','<script src="v15.js"></script><script src="v151.js"></script></body>')
          p.write_text(h,encoding='utf-8')
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'CromosLiga2627v151'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.cervantes.cromosliga2627.v151'
            compileSdk 35

            defaultConfig {
              applicationId 'com.cervantes.cromosliga2627.v151'
              minSdk 24
              targetSdk 35
              versionCode 151
              versionName '1.5.1'
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="true"
              android:label="Cromos Liga 26-27 v1.5.1"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#0b1220</item>
              <item name="android:navigationBarColor">#0b1220</item>
              <item name="android:colorAccent">#166534</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
            <color name="icon_bg">#063565</color>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <solid android:color="#063565"/>
                <corners android:radius="22dp"/>
              </shape>
            </item>
            <item android:left="7dp" android:top="7dp" android:right="7dp" android:bottom="7dp">
              <bitmap android:src="@drawable/app_icon_foreground" android:gravity="fill"/>
            </item>
          </layer-list>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg"/>
            <foreground android:drawable="@drawable/app_icon_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/cervantes/cromosliga2627/v151/MainActivity.java <<'EOF'
          package com.cervantes.cromosliga2627.v151;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView web = new WebView(this);
              WebSettings settings = web.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              web.addJavascriptInterface(new ShareBridge(), "Android");
              web.loadUrl("file:///android_asset/index.html");
              setContentView(web);
            }

            private class ShareBridge {
              @JavascriptInterface
              public void share(String text) {
                Intent intent = new Intent(Intent.ACTION_SEND);
                intent.setType("text/plain");
                intent.putExtra(Intent.EXTRA_TEXT, text);
                startActivity(Intent.createChooser(intent, "Compartir"));
              }
            }
          }
          EOF

      - name: Validate HTML JavaScript and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert '<script>' in h and '</script>' in h
          assert 'v15.js' in h and 'v151.js' in h
          js=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          icon=Path('app/src/main/res/drawable/app_icon_foreground.png')
          logos=Path('app/src/main/assets/logos_sprite.webp')
          assert icon.exists() and icon.stat().st_size > 10000
          assert logos.exists() and logos.stat().st_size > 1000
          print('HTML chars:',len(h))
          print('Icon bytes:',icon.stat().st_size)
          print('Logo sprite bytes:',logos.stat().st_size)
          PY
          node --check /tmp/app.js
          node --check app/src/main/assets/v15.js
          node --check app/src/main/assets/v151.js
          file app/src/main/res/drawable/app_icon_foreground.png
          file app/src/main/assets/logos_sprite.webp

      - name: Build APK from source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK alignment signature icon and logos
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee verification.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | tee application-id.txt
          unzip -lv "$APK" | grep 'resources.arsc' | tee resources-arsc.txt
          unzip -l "$APK" | grep 'assets/logos_sprite.webp' | tee logos-asset.txt
          unzip -l "$APK" | grep 'app_icon_foreground' | tee icon-asset.txt
          unzip -p "$APK" assets/index.html | grep 'v151.js' | tee v151-injected.txt
          cp "$APK" CromosLiga2627_v1.5.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CromosLiga2627-v1.5.1
          path: |
            CromosLiga2627_v1.5.1.apk
            verification.txt
            application-id.txt
            resources-arsc.txt
            logos-asset.txt
            icon-asset.txt
            v151-injected.txt
