name: Build Rebuilt v1.5.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'buildsrc/html/**'
      - 'buildsrc/v15.js'
      - 'buildsrc/v152.js'
      - 'buildsrc/assets_b64/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate clean Android project
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi

          rm -rf app settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/cervantes/cromosliga2627/v152
          mkdir -p app/src/main/assets/escudos
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat buildsrc/html/index_00.part \
              buildsrc/html/index_01.part \
              buildsrc/html/index_02.part \
              buildsrc/html/index_03.part \
              buildsrc/html/index_04.part \
              buildsrc/html/index_05.part \
              > app/src/main/assets/index.html

          cp buildsrc/v15.js app/src/main/assets/v15.js
          cp buildsrc/v152.js app/src/main/assets/v152.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          h=p.read_text(encoding='utf-8')
          h=h.replace('</body>','<script src="v15.js"></script><script src="v152.js"></script></body>')
          p.write_text(h,encoding='utf-8')
          PY

          # Reconstruir el ZIP validado con 20 escudos + icono.
          cat buildsrc/assets_b64/v152_00.part \
              buildsrc/assets_b64/v152_01.part \
              buildsrc/assets_b64/v152_02.part \
              buildsrc/assets_b64/v152_03.part \
              buildsrc/assets_b64/v152_04.part \
              buildsrc/assets_b64/v152_05.part \
              buildsrc/assets_b64/v152_06.part \
              buildsrc/assets_b64/v152_07.part \
              > /tmp/v152_assets.b64

          base64 -d /tmp/v152_assets.b64 > /tmp/v152_assets.zip
          echo "513b82dccefedcbebdaede82c5805944ee8d4abae0933c34b86413093f48cb65  /tmp/v152_assets.zip" | sha256sum -c -
          unzip -t /tmp/v152_assets.zip

          mkdir -p /tmp/v152_assets
          unzip -q /tmp/v152_assets.zip -d /tmp/v152_assets

          find /tmp/v152_assets -maxdepth 1 -type f -name '*.png' ! -name 'ic_launcher.png' -exec cp {} app/src/main/assets/escudos/ \;
          test "$(find app/src/main/assets/escudos -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 20

          # Icono PNG clásico; sin adaptive icon.
          cp /tmp/v152_assets/ic_launcher.png /tmp/icon_96.png
          identify /tmp/icon_96.png

          convert /tmp/icon_96.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon_96.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp /tmp/icon_96.png                       app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon_96.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon_96.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'CromosLiga2627v152'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.cervantes.cromosliga2627.v152'
            compileSdk 35

            defaultConfig {
              applicationId 'com.cervantes.cromosliga2627.v152'
              minSdk 24
              targetSdk 35
              versionCode 152
              versionName '1.5.2'
            }
          }

          dependencies {
            implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="true"
              android:label="Cromos Liga 26-27 v1.5.2"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="false">

              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>

              <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.fileprovider"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths"/>
              </provider>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#0b1220</item>
              <item name="android:navigationBarColor">#0b1220</item>
              <item name="android:colorAccent">#166534</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <cache-path name="shared_files" path="shared/"/>
          </paths>
          EOF

          cat > app/src/main/java/com/cervantes/cromosliga2627/v152/MainActivity.java <<'EOF'
          package com.cervantes.cromosliga2627.v152;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.core.content.FileProvider;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
            private static final int PICK_LIST_FILE = 1520;
            private WebView web;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              web = new WebView(this);
              WebSettings settings = web.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);

              web.addJavascriptInterface(new AndroidBridge(), "Android");
              web.loadUrl("file:///android_asset/index.html");
              setContentView(web);
            }

            private class AndroidBridge {
              @JavascriptInterface
              public void share(String text) {
                runOnUiThread(() -> {
                  Intent intent = new Intent(Intent.ACTION_SEND);
                  intent.setType("text/plain");
                  intent.putExtra(Intent.EXTRA_TEXT, text);
                  startActivity(Intent.createChooser(intent, "Compartir"));
                });
              }

              @JavascriptInterface
              public void shareFile(String filename, String content, String mimeType) {
                runOnUiThread(() -> {
                  try {
                    String safeName = filename == null ? "cromos.txt"
                      : filename.replaceAll("[^A-Za-z0-9._-]", "_");

                    File dir = new File(getCacheDir(), "shared");
                    if (!dir.exists() && !dir.mkdirs()) {
                      throw new IllegalStateException("No se pudo crear la carpeta temporal");
                    }

                    File file = new File(dir, safeName);
                    try (FileOutputStream out = new FileOutputStream(file)) {
                      out.write((content == null ? "" : content).getBytes(StandardCharsets.UTF_8));
                    }

                    Uri uri = FileProvider.getUriForFile(
                      MainActivity.this,
                      getPackageName() + ".fileprovider",
                      file
                    );

                    Intent send = new Intent(Intent.ACTION_SEND);
                    send.setType((mimeType == null || mimeType.isEmpty()) ? "text/plain" : mimeType);
                    send.putExtra(Intent.EXTRA_STREAM, uri);
                    send.putExtra(Intent.EXTRA_SUBJECT, safeName);
                    send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    startActivity(Intent.createChooser(send, "Compartir archivo"));
                  } catch (Exception e) {
                    callImportError("No se pudo crear el archivo: " + e.getMessage());
                  }
                });
              }

              @JavascriptInterface
              public void pickFile() {
                runOnUiThread(() -> {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");
                  intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{
                    "text/plain",
                    "text/csv",
                    "application/json",
                    "text/comma-separated-values"
                  });
                  startActivityForResult(intent, PICK_LIST_FILE);
                });
              }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode != PICK_LIST_FILE || resultCode != RESULT_OK || data == null) return;

              Uri uri = data.getData();
              if (uri == null) {
                callImportError("No se pudo abrir el archivo");
                return;
              }

              try {
                String name = readDisplayName(uri);
                String text = readText(uri);
                String js = "window.onImportedList(" +
                  JSONObject.quote(text) + "," + JSONObject.quote(name) + ");";
                web.evaluateJavascript(js, null);
              } catch (Exception e) {
                callImportError("No se pudo leer el archivo: " + e.getMessage());
              }
            }

            private String readDisplayName(Uri uri) {
              String name = "lista_recibida.txt";
              Cursor cursor = null;
              try {
                cursor = getContentResolver().query(uri, null, null, null, null);
                if (cursor != null && cursor.moveToFirst()) {
                  int ix = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                  if (ix >= 0) name = cursor.getString(ix);
                }
              } finally {
                if (cursor != null) cursor.close();
              }
              return name == null ? "lista_recibida.txt" : name;
            }

            private String readText(Uri uri) throws Exception {
              try (InputStream in = getContentResolver().openInputStream(uri);
                   ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                if (in == null) throw new IllegalStateException("Archivo no disponible");
                byte[] buffer = new byte[8192];
                int n;
                int total = 0;
                while ((n = in.read(buffer)) >= 0) {
                  total += n;
                  if (total > 2_000_000) throw new IllegalStateException("Archivo demasiado grande");
                  out.write(buffer, 0, n);
                }
                return out.toString(StandardCharsets.UTF_8.name());
              }
            }

            private void callImportError(String message) {
              if (web == null) return;
              runOnUiThread(() ->
                web.evaluateJavascript(
                  "window.onImportError(" + JSONObject.quote(message) + ");",
                  null
                )
              );
            }
          }
          EOF

      - name: Validate JavaScript, PNG crests and launcher icon
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert '<script>' in h and '</script>' in h
          assert 'v15.js' in h and 'v152.js' in h
          js=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          logos=list(Path('app/src/main/assets/escudos').glob('*.png'))
          assert len(logos)==20, len(logos)
          for p in logos:
            assert p.stat().st_size > 500, (p, p.stat().st_size)
          for p in Path('app/src/main/res').glob('mipmap-*/ic_launcher.png'):
            assert p.stat().st_size > 500, (p, p.stat().st_size)
          print('Escudos PNG:',len(logos))
          print('Iconos launcher:',len(list(Path('app/src/main/res').glob('mipmap-*/ic_launcher.png'))))
          PY

          node --check /tmp/app.js
          node --check app/src/main/assets/v15.js
          node --check app/src/main/assets/v152.js

          identify app/src/main/assets/escudos/alaves.png
          identify app/src/main/assets/escudos/realmadrid.png
          identify app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK from source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature, icons, crests and file bridge
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee verification.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | tee application-id.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|application:|application-icon' | tee badging.txt

          COUNT=$(unzip -l "$APK" | grep -c 'assets/escudos/.*\.png')
          echo "Escudos dentro del APK: $COUNT" | tee escudos-asset.txt
          test "$COUNT" -eq 20

          unzip -p "$APK" assets/escudos/alaves.png > /tmp/apk-alaves.png
          identify /tmp/apk-alaves.png | tee escudo-image-check.txt

          unzip -p "$APK" assets/index.html | grep 'v152.js' | tee v152-injected.txt
          unzip -p "$APK" assets/v152.js | grep 'shareFile' | tee share-file-check.txt
          unzip -p "$APK" assets/v152.js | grep 'pickFile' | tee import-file-check.txt

          cp "$APK" CromosLiga2627_v1.5.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CromosLiga2627-v1.5.2
          path: |
            CromosLiga2627_v1.5.2.apk
            verification.txt
            application-id.txt
            badging.txt
            escudos-asset.txt
            escudo-image-check.txt
            v152-injected.txt
            share-file-check.txt
            import-file-check.txt
